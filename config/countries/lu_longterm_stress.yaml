# Long-Term Debt Stress Indicator — LU (2-component — no BIS debt-service coverage)
# ─────────────────────────────────────────────────────────────────────────────
# Rolled out 2026-10-03 (coverage-audit, High item #3). LU is not a BIS
# WS_DSR reporting entity, so the household-debt-service component (Ray's
# #2 priority, "the earliest stress signal") cannot be sourced free today —
# this stays a genuine, documented gap rather than a silently thinner read.
# Runs on just gov+household debt/GDP + primary fiscal balance/GDP, weights
# renormalized to sum to 1.0 from the US config's own 0.25/0.10 for these two.
# ─────────────────────────────────────────────────────────────────────────────

country: LU

z_score:
  window_quarters: 40
  min_periods_quarters: 20
  window_annual: 10
  min_periods_annual: 5
  look_back_shift: 1

coverage:
  # Only 2-3 weight slots total at this stage, so losing even one component
  # is a much bigger hit than in the US's 7-component config. Kept at the
  # same 0.60 default rather than loosening it — a genuinely thin composite
  # should say so (low_coverage=true) rather than being propped up.
  min_retained_weight: 0.60

staleness:
  expected_lag_quarters:
    Q: 1
    A: 4
  stale_weight_halflife: 4
  stale_min_weight_fraction: 0.20
  # Loosened from the US config's 4Q: this country's primary_balance_gdp
  # leg is IMF/WB annual data (not the US's faster FRED fiscal-year proxy)
  # and runs ~7 quarters behind in practice (confirmed 2026-10-03: latest
  # available vintage is 2024-12, ~22 months old). 4Q would drop that
  # component almost permanently; 8Q (2 years) gives it real margin to
  # actually contribute.
  max_carry_quarters: 8
  extrapolation:
    enabled: false
    method: rolling_mean
    window_quarters: 8

bands:
  # ⚠ NOT VALIDATED RISK THRESHOLDS — same exploratory display bands as the
  # US config; not recalibrated per country.
  below_normal_upper: -0.5
  elevated_lower: 0.5
  high_lower: 1.0

dynamic_weighting:
  enabled: true
  k: 0.2
  stock_components:
    - gov_household_debt_gdp
  flow_components:
    - primary_balance_gdp

components:
  - id: gov_household_debt_gdp
    label: "Govt + Household debt / GDP"
    weight: 0.71
    stress_direction: positive
    frequency: Q
    construction: derived
    sources:
      - signal: lu.credit.gov_debt_gdp
      - signal: lu.credit.household_debt_gdp
    notes: >
      Same construction as the US config. Weight renormalized from the US
      config's 0.25 (of 0.25+0.10=0.35 raw, since household_debt_service is
      unavailable for this country).

  - id: primary_balance_gdp
    label: "Primary fiscal balance / GDP"
    weight: 0.29
    stress_direction: negative
    frequency: A
    construction: signal
    sources:
      - signal: lu.fiscal.primary_balance_gdp
    notes: >
      IMF/World-Bank-sourced general-government primary balance. Negated: a
      larger surplus lowers the stress contribution. Weight renormalized
      from the US config's 0.10.
