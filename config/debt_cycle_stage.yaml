    private_debt: [credit.household_debt_gdp, credit.corporate_debt_gdp]
    gov_interest_gdp: fiscal.gov_interest_gdp
    gov_revenue: fiscal.govt_revenue_gdp
    marginal_yields: [policy.yield_10y]
  MX:
    gov_debt: credit.gov_debt_gdp
    private_debt: [credit.household_debt_gdp, credit.corporate_debt_gdp]
    gov_interest_gdp: fiscal.gov_interest_gdp
    gov_revenue: fiscal.govt_revenue_gdp
    marginal_yields: [policy.yield_10y]
  ID:
    gov_debt: credit.gov_debt_gdp
    private_debt: [credit.household_debt_gdp, credit.corporate_debt_gdp]
    gov_interest_gdp: fiscal.gov_interest_gdp
    # No fiscal.govt_revenue_gdp for ID -> gov_dsr (interest/revenue) can't
    # compute, but gov_interest_gdp/gov_interest_z still can (Sovereign
    # Squeeze is an OR across conditions, so this alone can still fire it).
    marginal_yields: [policy.rate_policy]
