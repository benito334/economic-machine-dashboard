# HOST_DATA_DIR / HOST_DB_DIR let this same compose file run unmodified on any
# machine — defaults match the NAS's locked-in CLAUDE.md paths, so nothing
# changes there. A different host (e.g. the Oracle VM) overrides both in its
# own .env to point at wherever its persistent volume actually lives.
x-common: &common
  build: .
  env_file: .env
  volumes:
    - ${HOST_DATA_DIR:-/mnt/data/project_data/finance/indicators_machine}:/data
    - ${HOST_DB_DIR:-/mnt/data/db/finance/indicators_machine}:/db
  environment:
    DATA_DIR: /data
    DB_PATH: /db/signals.duckdb
    RAW_CACHE_DIR: /data/raw_cache
    SNAPSHOTS_DIR: /data/snapshots
    MANUAL_DATA_DIR: /data/manual_data

# Retired 2026-07-06 UI cleanup (see archive/README.md):
#   dashboard (:8501 Streamlit proof) and lc_api/lc_frontend (:8004/:8503
#   TradingView SPA) — both predated the two-chip regime system and showed
#   contradictory 4-season labels. The Dash app on :8502 is the dashboard.

services:
  pipeline:
    <<: *common
    command: python -m indicators.pipeline

  charting:
    <<: *common
    ports:
      # CHARTING_BIND defaults to all interfaces, which is what a local/NAS
      # instance wants. The public VM sets CHARTING_BIND=127.0.0.1 so the app
      # is reachable ONLY through the reverse proxy — if the host firewall is
      # ever misconfigured, the app still isn't directly exposed.
      - "${CHARTING_BIND:-0.0.0.0}:8502:8502"
    environment:
      DATA_DIR: /data
      DB_PATH: /db/signals.duckdb
      RAW_CACHE_DIR: /data/raw_cache
      SNAPSHOTS_DIR: /data/snapshots
      MANUAL_DATA_DIR: /data/manual_data
      CHARTING_PORT: "8502"
      DASH_DEBUG: "0"
      # Set PUBLIC_MODE=1 for an untrusted public/cloud deploy — hides every
      # control that writes shared state (the Data-updates scheduler, Weight
      # Audit/History, Workbench save/delete). Per-browser settings stay live.
      PUBLIC_MODE: "${PUBLIC_MODE:-}"
      # Traffic metrics page (/traffic). On a public deploy set a key and view
      # at /traffic?key=<TRAFFIC_KEY>; leave empty on a local instance for an
      # open, sidebar-linked page.
      TRAFFIC_KEY: "${TRAFFIC_KEY:-}"
      # Feedback dialog -> Google Apps Script -> Sheet. The browser POSTs
      # directly; this deployment never writes feedback anywhere. Unset =
      # the Feedback button is not rendered at all.
      FEEDBACK_ENDPOINT: "${FEEDBACK_ENDPOINT:-}"
      FEEDBACK_TOKEN: "${FEEDBACK_TOKEN:-}"
      # The image has no .git, so the feedback dialog reads the version here.
      APP_VERSION: "${APP_VERSION:-}"
      # "snapshot" (default, Cloud Run's frozen release) or "live" (the Oracle
      # VM, which runs the nightly import). Drives the provenance banner's
      # wording — calling a live instance a static snapshot is just false.
      DEPLOY_KIND: "${DEPLOY_KIND:-}"
    command: python -m dashboard.charting
    restart: always

  # Daily auto-import (opt-in; configured from the dashboard Settings menu).
  # Automates the manual workflow: stop charting -> run pipeline -> start
  # charting, at the time set in Settings. Needs the docker socket to bounce
  # the charting container (the DB is single-writer). TZ sets the schedule's
  # timezone — override in .env (e.g. TZ=America/Chicago) to match your clock.
  scheduler:
    <<: *common
    environment:
      DATA_DIR: /data
      DB_PATH: /db/signals.duckdb
      RAW_CACHE_DIR: /data/raw_cache
      SNAPSHOTS_DIR: /data/snapshots
      MANUAL_DATA_DIR: /data/manual_data
      TZ: "${TZ:-America/Chicago}"
      # In PUBLIC_MODE the Settings UI is hidden, so configure the daily import
      # here instead (the scheduler reads these, and they win over schedule.json):
      AUTO_IMPORT_ENABLED: "${AUTO_IMPORT_ENABLED:-}"
      AUTO_IMPORT_TIME: "${AUTO_IMPORT_TIME:-}"
    volumes:
      - ${HOST_DATA_DIR:-/mnt/data/project_data/finance/indicators_machine}:/data
      - ${HOST_DB_DIR:-/mnt/data/db/finance/indicators_machine}:/db
      - /var/run/docker.sock:/var/run/docker.sock   # to bounce the charting container
    command: python -m indicators.scheduler
    # `always` (not `unless-stopped`): on a hard reboot, the shutdown sequence
    # stops containers before power actually cuts, which `unless-stopped`
    # treats as an intentional stop and will NOT restart on the next daemon
    # start. `always` restarts regardless of how it last stopped — verified
    # 2026-09-07 after a hard reboot left both services down despite
    # `unless-stopped` on this one.
    restart: always
